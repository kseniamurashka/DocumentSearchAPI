[project]
name = "document-search"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17,<2.0",
    "asyncpg>=0.31,<1.0",
    "elasticsearch[async]>=8.19,<9.0",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings>=2.12,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.3,<2.0",
]
